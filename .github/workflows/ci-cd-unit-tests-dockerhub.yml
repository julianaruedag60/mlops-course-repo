name: CI Unit Tests + DockerHub Publish

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "assignment_3_cicd/**"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"
  pull_request:
    branches:
      - main
    paths:
      - "assignment_3_cicd/**"
      - ".github/workflows/ci-cd-unit-tests-dockerhub.yml"

env:
  PYTHON_VERSION: "3.11"
  APP_PATH: "assignment_3_cicd"
  IMAGE_NAME: "julianarueda/mlops-preprocessing-api"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r $APP_PATH/requirements.txt

      - name: Run unit tests
        run: |
          cd $APP_PATH
          pytest

      - name: Run unit tests inside Docker container
        run: |
          docker build -t preprocessing-api:ci $APP_PATH
          docker run --rm preprocessing-api:ci

  publish-dockerhub:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: DOCKERHUB
      url: https://hub.docker.com/r/${{ env.IMAGE_NAME }}/tags
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
